<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff0000, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #aaa;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="url"] {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #ff4444;
    }

    input[type="url"]::placeholder {
      color: #555;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 20px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #ff0000;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #cc0000;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .format-toggle {
      display: flex;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .format-toggle label {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #888;
      transition: all 0.2s;
      user-select: none;
    }

    .format-toggle input[type="radio"] {
      display: none;
    }

    .format-toggle input[type="radio"]:checked + label {
      background: #ff0000;
      color: #fff;
    }

    /* Video info */
    #video-info {
      display: none;
      border-top: 1px solid #2a2a2a;
      padding-top: 20px;
      margin-top: 4px;
    }

    .info-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .info-row img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .info-details h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .info-details p {
      font-size: 0.82rem;
      color: #888;
    }

    .download-btn-wrap {
      margin-top: 16px;
    }

    .btn-download {
      background: #1db954;
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border-radius: 10px;
    }

    .btn-download:hover:not(:disabled) {
      background: #17a348;
    }

    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Progress */
    #progress-section {
      display: none;
      margin-top: 16px;
    }

    .progress-bar-wrap {
      background: #0f0f0f;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff6b6b);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }

    #status-text {
      font-size: 0.82rem;
      color: #888;
      word-break: break-all;
    }

    /* Error */
    .error-msg {
      color: #ff6b6b;
      font-size: 0.88rem;
      margin-top: 12px;
      display: none;
    }

    /* Success */
    #success-section {
      display: none;
      margin-top: 16px;
      text-align: center;
    }

    #success-section p {
      color: #1db954;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .btn-again {
      background: #333;
      color: #fff;
      padding: 10px 24px;
      font-size: 0.9rem;
    }

    .btn-again:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Downloader</h1>
    <p>Download videos as MP4 or extract audio as MP3</p>
  </header>

  <div class="card">
    <div class="input-group">
      <input type="url" id="url-input" placeholder="Paste YouTube URL here..." />
      <button class="btn-primary" id="fetch-btn" onclick="fetchInfo()">Fetch</button>
    </div>

    <div class="format-toggle">
      <input type="radio" name="format" id="fmt-mp4" value="mp4" checked />
      <label for="fmt-mp4">MP4 (Video)</label>
      <input type="radio" name="format" id="fmt-mp3" value="mp3" />
      <label for="fmt-mp3">MP3 (Audio)</label>
    </div>

    <div id="video-info">
      <div class="info-row">
        <img id="thumbnail" src="" alt="Thumbnail" />
        <div class="info-details">
          <h3 id="video-title"></h3>
          <p id="video-meta"></p>
        </div>
      </div>
      <div class="download-btn-wrap">
        <button class="btn-download" id="download-btn" onclick="startDownload()">Download</button>
      </div>
    </div>

    <div id="progress-section">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div id="status-text">Starting download...</div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div id="success-section">
      <p>Download complete! Your file should save automatically.</p>
      <button class="btn-again" onclick="reset()">Download Another</button>
    </div>
  </div>

  <script>
    let currentUrl = '';
    let currentSessionId = '';

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-msg').style.display = 'none';
    }

    async function fetchInfo() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) return;

      hideError();
      document.getElementById('video-info').style.display = 'none';
      document.getElementById('progress-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'none';

      const btn = document.getElementById('fetch-btn');
      btn.disabled = true;
      btn.textContent = 'Fetching...';

      try {
        const res = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Failed to fetch video info');
          return;
        }

        currentUrl = url;
        document.getElementById('thumbnail').src = data.thumbnail;
        document.getElementById('video-title').textContent = data.title;
        document.getElementById('video-meta').textContent =
          `${data.uploader || 'Unknown'} • ${data.duration || '?'} • ${
            data.viewCount ? Number(data.viewCount).toLocaleString() + ' views' : ''
          }`;
        document.getElementById('video-info').style.display = 'block';
      } catch (e) {
        showError('Network error. Is the server running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch';
      }
    }

    async function startDownload() {
      if (!currentUrl) return;

      hideError();
      const format = document.querySelector('input[name="format"]:checked').value;
      const downloadBtn = document.getElementById('download-btn');
      const progressSection = document.getElementById('progress-section');
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('status-text');

      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Downloading...';
      progressSection.style.display = 'block';
      progressBar.style.width = '0%';
      statusText.textContent = 'Starting download...';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: currentUrl, format }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const event = JSON.parse(line.slice(6));
              handleEvent(event, progressBar, statusText, downloadBtn, format);
            } catch {}
          }
        }
      } catch (e) {
        showError('Download failed. Please try again.');
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download';
      }
    }

    function handleEvent(event, progressBar, statusText, downloadBtn, format) {
      if (event.type === 'progress') {
        progressBar.style.width = `${event.percent}%`;
        statusText.textContent = `Downloading... ${event.percent.toFixed(1)}%`;
      } else if (event.type === 'status') {
        // Show relevant status messages (skip noisy ones)
        if (event.message && !event.message.includes('WARNING')) {
          statusText.textContent = event.message.substring(0, 100);
        }
      } else if (event.type === 'done') {
        currentSessionId = event.fileId;
        progressBar.style.width = '100%';
        statusText.textContent = 'Processing complete!';

        // Trigger file download
        const a = document.createElement('a');
        a.href = `/api/file/${event.fileId}`;
        a.download = event.filename.replace(/^[a-f0-9]{16}\./, `download.`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        document.getElementById('progress-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download';
      } else if (event.type === 'error') {
        showError(event.message || 'Download failed');
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download';
        document.getElementById('progress-section').style.display = 'none';
      }
    }

    function reset() {
      document.getElementById('url-input').value = '';
      document.getElementById('video-info').style.display = 'none';
      document.getElementById('progress-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'none';
      hideError();
      currentUrl = '';
      currentSessionId = '';
    }

    // Allow pressing Enter in the URL input
    document.getElementById('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchInfo();
    });
  </script>
</body>
</html>
